<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Secular-ly website mockup</title>
  <desc id="desc">A static SVG mockup of the dark-themed Secular-ly page. Controls are illustrative only and do not run code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241e22"/>
      <stop offset="100%" stop-color="#171317"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30272e"/>
      <stop offset="100%" stop-color="#2a2228"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <rect x="118" y="54" width="664" height="452" rx="10" fill="#151115" opacity=".42"/>
  <rect x="110" y="46" width="664" height="452" rx="8" fill="url(#panel)" stroke="#493641" stroke-width="1.5"/>
  <text x="144" y="100" fill="#dad3d8" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Secular-ly</text>
  <text x="144" y="143" fill="#dad3d8" font-family="Arial, Helvetica, sans-serif" font-size="17">
    <tspan x="144" dy="0">A static visual recreation of the page from your repository.</tspan>
    <tspan x="144" dy="27">This SVG is artwork only; it does not run the original website JavaScript.</tspan>
  </text>
  <rect x="144" y="211" width="596" height="106" rx="5" fill="#241e23" stroke="#493641"/>
  <circle cx="169" cy="239" r="6" fill="#bd6daa"/>
  <text x="187" y="245" fill="#dad3d8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600">Status</text>
  <text x="166" y="277" fill="#c5b8c2" font-family="Arial, Helvetica, sans-serif" font-size="15">Static preview — interactive features are not active in this SVG.</text>
  <rect x="144" y="343" width="168" height="42" rx="5" fill="#6c3364"/>
  <text x="228" y="369" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="700">Preview button</text>
  <text x="144" y="425" fill="#b9aab5" font-family="Arial, Helvetica, sans-serif" font-size="13">Original source: github.com/kr2pvsypkq-web/ms</text>
  <line x1="144" y1="444" x2="740" y2="444" stroke="#51404c"/>
  <text x="144" y="472" fill="#9e8d99" font-family="Arial, Helvetica, sans-serif" font-size="12">SVG format • scalable vector graphic • static mockup</text>
</svg>
